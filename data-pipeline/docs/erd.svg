<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1450" viewBox="0 0 1700 1450" role="img" aria-labelledby="title desc">
  <title id="title">Company Data Pipeline Entity-Relationship Diagram</title>
  <desc id="desc">Proposed normalized relational model. Companies link to company detail tables and ownership links. Family tree responses contain members, which have roles. Financial statements contain financial items.</desc>
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526078; }
      .entity { fill: #fff; stroke: #7890b5; stroke-width: 2; rx: 12; }
      .core { fill: #e8f1ff; stroke: #3169b3; stroke-width: 3; rx: 14; }
      .family { fill: #f2edff; stroke: #8660bd; stroke-width: 2; rx: 12; }
      .entity-title { font-size: 15px; font-weight: 700; }
      .field { font-size: 12px; fill: #42506a; }
      .relation { fill: none; stroke: #66758d; stroke-width: 2; }
      .rel-label { font-size: 11px; font-weight: 600; fill: #53627a; }
      .legend { font-size: 12px; fill: #526078; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#66758d" />
    </marker>
  </defs>
  <rect width="1700" height="1450" fill="#f8faff" />
  <text class="title" x="850" y="45" text-anchor="middle">Company Data Pipeline — Proposed Normalized ERD</text>
  <text class="subtitle" x="850" y="72" text-anchor="middle">Logical schema proposal; the current pipeline outputs a flat Parquet extract, not these normalized tables.</text>

  <!-- Relationships are drawn first so they appear behind entities. Arrows point to the child/many side. -->
  <g class="relation" marker-end="url(#arrow)">
    <path d="M685 480 C570 420 485 270 400 185"/><path d="M685 510 C570 480 485 420 400 405"/>
    <path d="M685 550 C560 575 485 630 400 625"/><path d="M685 585 C560 650 485 820 400 845"/>
    <path d="M1015 480 C1130 420 1215 270 1300 185"/><path d="M1015 515 C1130 480 1215 420 1300 405"/>
    <path d="M1015 555 C1130 580 1215 630 1300 625"/><path d="M1015 590 C1130 660 1215 820 1300 845"/>
    <path d="M850 610 L850 900"/>
    <path d="M1465 250 L1465 285"/><path d="M1465 470 L1465 505"/>
    <path d="M1300 185 C1240 350 1200 800 1300 1065"/>
    <path d="M1300 1065 L1300 1225"/>
    <path d="M400 405 C650 330 1000 330 1300 185"/>
    <path d="M1300 625 C1110 760 1080 1030 1300 1065"/>
  </g>
  <g class="rel-label" text-anchor="middle">
    <text x="505" y="300">1 : many</text><text x="505" y="450">1 : many</text>
    <text x="505" y="600">1 : many</text><text x="505" y="750">1 : many</text>
    <text x="1195" y="300">1 : many</text><text x="1195" y="450">1 : many</text>
    <text x="1195" y="600">1 : many</text><text x="1195" y="750">1 : many</text>
    <text x="875" y="760">1 : many</text>
    <text x="1482" y="272">1 : many</text><text x="1482" y="492">1 : many</text>
    <text x="1270" y="1150">1 : many</text><text x="1270" y="1210">1 : many</text>
  </g>

  <!-- Company child tables -->
  <g transform="translate(70 120)"><rect class="entity" width="330" height="130"/><text class="entity-title" x="16" y="28">COMPANY_ADDRESSES</text><text class="field" x="16" y="55">PK address_id · FK duns</text><text class="field" x="16" y="77">role, address lines, locality, region</text><text class="field" x="16" y="99">country, postal code, coordinates</text></g>
  <g transform="translate(70 340)"><rect class="entity" width="330" height="130"/><text class="entity-title" x="16" y="28">COMPANY_INDUSTRY_CODES</text><text class="field" x="16" y="55">PK industry_code_id · FK duns</text><text class="field" x="16" y="77">code, description, classification system</text><text class="field" x="16" y="99">priority, primary marker</text></g>
  <g transform="translate(70 560)"><rect class="entity" width="330" height="130"/><text class="entity-title" x="16" y="28">COMPANY_EMPLOYEE_OBSERVATIONS</text><text class="field" x="16" y="55">PK employee_observation_id · FK duns</text><text class="field" x="16" y="77">value/range, date, scope, reliability</text><text class="field" x="16" y="99">employee category</text></g>
  <g transform="translate(70 780)"><rect class="entity" width="330" height="130"/><text class="entity-title" x="16" y="28">COMPANY_CONTACTS</text><text class="field" x="16" y="55">PK contact_id · FK duns</text><text class="field" x="16" y="77">contact type, value, country/ISD code</text><text class="field" x="16" y="99">domain, source</text></g>

  <g transform="translate(1300 120)"><rect class="entity" width="330" height="130"/><text class="entity-title" x="16" y="28">COMPANY_FINANCIAL_STATEMENTS</text><text class="field" x="16" y="55">PK financial_statement_id · FK duns</text><text class="field" x="16" y="77">fiscal dates, scope, reliability</text><text class="field" x="16" y="99">currency, units, audit/restated flags</text></g>
  <g transform="translate(1300 340)"><rect class="entity" width="330" height="130"/><text class="entity-title" x="16" y="28">COMPANY_REGISTRATION_NUMBERS</text><text class="field" x="16" y="55">PK registration_id · FK duns</text><text class="field" x="16" y="77">number, type/class, preferred flag</text><text class="field" x="16" y="99">jurisdiction/location</text></g>
  <g transform="translate(1300 560)"><rect class="entity" width="330" height="130"/><text class="entity-title" x="16" y="28">COMPANY_STOCK_EXCHANGES</text><text class="field" x="16" y="55">PK listing_id · FK duns</text><text class="field" x="16" y="77">ticker, exchange, country</text><text class="field" x="16" y="99">primary marker</text></g>
  <g transform="translate(1300 780)"><rect class="entity" width="330" height="130"/><text class="entity-title" x="16" y="28">COMPANY_OWNERSHIP_LINKS</text><text class="field" x="16" y="55">FK duns → COMPANIES.duns</text><text class="field" x="16" y="77">related_duns → COMPANIES.duns</text><text class="field" x="16" y="99">relationship role, level, effective dates</text></g>

  <!-- Core company entity -->
  <g transform="translate(685 480)"><rect class="core" width="330" height="130"/><text class="entity-title" x="20" y="34" style="font-size:19px">COMPANIES</text><text class="field" x="20" y="64">PK duns (business key)</text><text class="field" x="20" y="87">names, LEI, legal form, country</text><text class="field" x="20" y="109">operating status, ownership attributes</text></g>

  <!-- Financial detail and family-tree response hierarchy -->
  <g transform="translate(1300 1000)"><rect class="entity" width="330" height="130"/><text class="entity-title" x="16" y="28">COMPANY_FINANCIAL_ITEMS</text><text class="field" x="16" y="55">FK financial_statement_id</text><text class="field" x="16" y="77">item key/code, description, value</text><text class="field" x="16" y="99">currency/units</text></g>
  <g transform="translate(685 900)"><rect class="family" width="330" height="130"/><text class="entity-title" x="16" y="28">FAMILY_TREE_RESPONSES</text><text class="field" x="16" y="55">PK response_id · inquiry DUNS</text><text class="field" x="16" y="77">global ultimate, member counts</text><text class="field" x="16" y="99">transaction ID/time, source links</text></g>
  <g transform="translate(685 1100)"><rect class="family" width="330" height="130"/><text class="entity-title" x="16" y="28">FAMILY_TREE_MEMBERS</text><text class="field" x="16" y="55">FK response_id · member DUNS</text><text class="field" x="16" y="77">hierarchy level, member identity/name</text><text class="field" x="16" y="99">response-level attributes</text></g>
  <g transform="translate(685 1300)"><rect class="family" width="330" height="115"/><text class="entity-title" x="16" y="28">FAMILY_TREE_MEMBER_ROLES</text><text class="field" x="16" y="56">FK response_id + member DUNS</text><text class="field" x="16" y="79">role code and description (multi-valued)</text></g>

  <text class="legend" x="70" y="1395">PK = primary key · FK = foreign key · Connectors indicate one-to-many relationships; ownership links are self-referencing.</text>
</svg>
